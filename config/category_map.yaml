# =====================================================================
# 統合カテゴリ生成ルール
#   大カテゴリ / 中カテゴリ / 小カテゴリ の3階層から、分析用の
#   「統合カテゴリ」を1列生成する。rules を上から順に評価し、最初に
#   一致した to を採用。どれにも一致しない行は default で生成する。
# =====================================================================
category_integration:
  # 入力データ側の列名（実データに合わせて変更する）
  source_columns:
    major: 大カテゴリ
    middle: 中カテゴリ
    minor: 小カテゴリ

  # 生成する列名
  output_column: 統合カテゴリ

  # 変換ルール（上から順に評価、最初に一致したものを採用）
  #   when: 各階層の値がリストのいずれかに一致すれば true（複数階層指定は AND）
  #   to  : 一致時に割り当てる統合カテゴリ名
  rules:
    - name: 締結系（中カテゴリ=締結）は締結不良に統合
      when:
        middle: [締結]
      to: 締結不良
    - name: 溶接系（中カテゴリ=溶接）は機能系に統合
      when:
        middle: [溶接]
      to: 機能系
    - name: 外観系（大カテゴリ=外観）は外観系に統合
      when:
        major: [外観]
      to: 外観系
    - name: 寸法系（大カテゴリ=寸法）は寸法系に統合
      when:
        major: [寸法]
      to: 寸法系

  # どのルールにも一致しない場合の既定生成
  #   method: concat（指定階層を連結）| major | middle | minor | const
  default:
    method: concat
    levels: [major, middle]
    separator: "＞"
    value: 未分類            # method=const のとき使用

  # 未マッチ行があれば警告ログを出す
  warn_unmatched: true

# =====================================================================
# 不良原因追求パイプライン 設定ファイル
#   VIN を主キーに 4 データ（トレーサビリティ/トレンド/不良/修正）を
#   統合・加工する。パス・対象期間・分析設定をここで一元管理。
# =====================================================================

project:
  name: defect-cause-analysis
  random_seed: 42

paths:
  reports_dir: reports         # データ辞書・サマリ
  logs_dir: logs

storage:
  # parquet を推奨（設計書 8 章）。pyarrow 未導入環境では自動で csv に
  # フォールバックする（io_utils.resolve_format 参照）。
  format: parquet              # parquet | csv

# ---------------------------------------------------------------------
# データカタログ（CSVの各列名・型・元ファイル名等を YAML に記録）
# ---------------------------------------------------------------------
catalog:
  input_glob: "data/raw/**/*.csv"   # 走査対象（glob。ディレクトリ/単一ファイルも可）
  output_path: reports/data_catalog.yaml
  datetime_detect_ratio: 0.9        # object列を日時とみなす最小パース成功率

# ---------------------------------------------------------------------
# 分析（EDA / 統計検定 / 機械学習）共通設定
#   目的: 「工程データ(トレンド・通過時間・設備・時間帯)から不良を予測/説明できるか」
#   を検証する。不良/修正の結果由来列はリークとして説明変数から必ず除外する。
# ---------------------------------------------------------------------
analysis:
  # stats（run_stats）/ ml（run_ml）が対象にする目的変数（vin_panel.parquet の列名）。
  #   has_defect は使えない（defect_*__has は「未検査」が NaN になり 0/1 が完全に揃わないため。
  #   docs/real_data_ingest_design.md §13-7）。has_repair_record は 0/1 が全 VIN で必ず定義される。
  #   defect_*__has も同じ理由（0/1+NaN の分類的な値でありそのまま回帰目的変数には使えない。D11）で
  #   regression の対象外。repair_修正__count は「未検査」概念が無く常に定義されるため使える。
  targets:
    classification: [has_repair_record]     # リペア記録有無
    regression: [repair_修正__count]        # 修正件数

  # 行フィルタ: load_real_panel 読込直後に「リスト順」で AND 適用する（EDA/ML/stats 全系に効く）。
  #   省略 or 空リストなら全件（現行挙動と完全一致）。
  #   1要素 = 「column + 演算子」か「query 単独」。演算子: eq / in / not_in / min / max。
  #   min と max は同一句で併用可（数値レンジ）。{設備}__{measure} のようにハイフンを含む列名は
  #   query の識別子として扱えないため、そのような列はレンジ/集合系の句（min/max/in）で指定する。
  #   設定例:
  #     filters:
  #       - {column: process_month, in: ["2026-01", "2026-02"]}   # 年月の複数指定
  #       - {column: plant_code,    eq: P01}                       # 存在時のみ有効（無ければ後述ポリシで処理）
  #       - {column: operator,      not_in: [op_ito]}              # 特定作業者を除外
  #       - {column: is_weekend,    eq: 0}                          # 平日のみ（is_weekend は 0/1）
  #       - {column: production_shift, in: ["1直", "2直"]}          # シフト
  #       - {column: lead_time_sec, min: 60, max: 3600}            # 数値レンジ（任意の数値列に対して）
  #       - {query: "ng_rate < 0.5"}                                # 任意式（pandas.DataFrame.query）
  filters: []

  # 存在しない列を指定した句の扱い: warn=その句だけスキップして継続 / error=即エラー
  #   plant_code・line_code のように「実データ次第で無い列」を warn で安全に無視する用途。
  filters_on_missing_column: warn   # warn | error（既定 warn）

  # 説明変数から除外する結果由来列（不良・修正の帰結）。
  #   leakage_prefixes / leakage_regex の規約で拾える列は極力ここに書かない
  #   （新しい結果列が増えても規約側で自動的に拾える状態を保つため）。
  leakage_columns: [first_defect_date, last_defect_date]
  # 結果由来列を接頭辞ファミリで自動除外（手動リスト保守を減らす）。
  #   EQ-xx__*, lead_time_*, wait_*, *_gap_sec, operator, production_*, is_weekend,
  #   process_month, plant_code, line_code, lot_no はいずれの接頭辞にも該当しない。
  leakage_prefixes: [defect, repair, severe, severity, top_defect, max_severity, time_to_repair, has_defect, has_severe, has_repair]
  # 名前が prefix に乗らない結果列（例: first_defect_date / last_defect_date）向けの正規表現（任意）
  leakage_regex: ["_defect_", "defect_date$"]
  # 識別子・生時刻（説明変数にしない）
  id_columns: [vin, vin_base, lot_no, first_in_ts, last_out_ts]
  cv_folds: 5
  test_size: 0.25
  random_state: 42
  # EDA（eda.py。実データ経路の vin_panel.parquet を読む）で層別に使う目的変数。
  #   has_defect は使えない（defect_*__has は「未検査」が NaN になり 0/1 が完全に揃わないため。
  #   docs/real_data_ingest_design.md §13-7）。has_repair_record は 0/1 が全 VIN で必ず定義される。
  eda_target: has_repair_record
  # ヒストグラム列。空なら「ほぼ一定でない」列に絞ったうえで欠損の少ない順に eda_histogram_max 本を自動選定
  eda_histogram_columns: []
  eda_histogram_max: 6
  eda_histogram_min_nunique: 10   # ヒストグラム対象とする最小ユニーク値数（これ未満は準定数として除外）
  # 設備あたりの測定値列数の上限（超過時は nunique 上位に絞る。実測: 242列の設備でヒートマップが40秒超）
  eda_max_measures_boxplot: 20
  eda_max_measures_heatmap: 15
  eda_max_categories: 15   # カテゴリ別リペア率チャートで扱う最大カテゴリ数（超過列は除外）
  eda_histogram_max_per_equipment: 6   # 設備別ヒストグラムの列数上限（分布の広い列を優先）
  eda_cross_equipment_top_k: 3         # 設備間ヒートマップに採用する設備あたりの代表列数
  eda_cross_equipment_max_columns: 60  # 設備間ヒートマップの総列数上限（超過時は先頭のみ使用）

  # 修正なし車 vs 特定カテゴリの修正があった車の対比列（分析時に導出。パネル（parquet）には保存しない。G2）。
  #   docs/repair_group_comparison_design.md 参照。列名はコード側で `repair_group__{name}` に固定され、
  #   leakage_prefixes の "repair" に前方一致するため resolve_predictors が説明変数から自動除外する（G3）。
  #   groups がちょうど2群のスペックは `repair_group__{name}__bin`（0.0/1.0/NaN）も対で生成され、
  #   analysis.targets.classification に足せば stats（BH-FDR 補正付き）で群間差検定ができる（G8・§7）。
  #   形式は2つ（併用不可。両方指定/両方省略はそのスペックだけ WARN でスキップ）:
  #     - groups: analysis.filters と同じ句のリスト（label 必須。複数の群に該当する行はリスト順で先勝ち。
  #       「該当カテゴリのカウント列（repair_修正__統合カテゴリ__*）が1件以上」を群の条件にするのが推奨）
  #     - base_column: 既存カテゴリ列（例: repair_修正__top_統合カテゴリ）をそのまま群として使う
  #   na_label を書くと、どの群にも該当しない行（groups）/ 欠損行（base_column）を第3群としてラベル化する。
  #   既定は空リスト（列は1本も増えず現行挙動と完全一致）。以下2件は例。不要なら削除可。
  repair_groups:
    - name: タレ
      groups:
        - {label: 修正なし, column: has_repair_record, eq: 0}
        - {label: タレ,     column: repair_修正__統合カテゴリ__タレ, min: 1}
    - name: 色ブツ
      groups:
        - {label: 修正なし, column: has_repair_record, eq: 0}
        - {label: 色ブツ,   column: repair_修正__統合カテゴリ__色ブツ_黒ブツ_白ブツ, min: 1}

  # 追加の EDA グラフ（既存の固定図に「追加」で出力される。空なら従来どおり固定図のみ）。
  #   type: scatter | bar | histogram | box | heatmap
  #   共通: title / output（reports/eda 配下のファイル名）/ filters（analysis.filters と同じ句）/ hue（色分け列）
  #   scatter: x,y（数値）| bar: x（カテゴリ）,y（数値・省略で件数）,agg | histogram: x（数値）,bins,density
  #   box: y（数値）,x（カテゴリ・任意）| heatmap: columns（数値列リスト）,method
  #   設定ミス（列が無い・型違い・フィルタ後 0 行）はその図だけ WARN でスキップし処理は継続する。
  #   例:
  #     custom_charts:
  #       - {type: scatter, x: EQ-01__pressure, y: EQ-01__stroke, hue: production_shift,
  #          title: 圧入 圧力×ストローク, output: custom_pressure_stroke.png}
  #       - {type: bar, x: 車種, y: has_repair_record, agg: mean,
  #          filters: [{column: process_month, in: ["2026-07"]}]}
  #       - {type: histogram, x: lead_time_sec, bins: 40, density: true, hue: has_repair_record}
  #       - {type: box, x: production_shift, y: EQ-01__pressure}
  #       - {type: heatmap, columns: [EQ-01__pressure, EQ-01__stroke, lead_time_sec], method: spearman}
  #   以下4件は analysis.repair_groups の例（タレ/色ブツ）を使った対比グラフ。例。不要なら削除可
  #   （docs/repair_group_comparison_design.md §6.1/§6.2）。
  custom_charts:
    - type: box
      x: repair_group__タレ
      y: ブース__フラッシュオフ_HAB1_送気_絶対湿度_測定値
      filters:
        - {column: repair_group__タレ, in: [修正なし, タレ]}
      title: 修正なし vs タレ修正 ｜ ブース フラッシュオフHAB1 送気 絶対湿度
      output: repair_group_タレ_絶対湿度.png
    - type: box
      x: repair_group__色ブツ
      y: trend__浮遊ゴミ_中上塗ブース前_粒子数_小_測定値
      filters:
        - {column: repair_group__色ブツ, in: [修正なし, 色ブツ]}
      title: 修正なし vs 色ブツ修正 ｜ 浮遊ゴミ 中上塗ブース前 粒子数(小)
      output: repair_group_色ブツ_浮遊ゴミ.png
    # 色ブツはライン層別（交絡対策。§1.3・§6.2 方法1）。中上塗ブース前粒子数はライン設備差の
    # 可能性があるため、全体図だけで「色ブツ修正が多いほど粒子数が多い」と即断しないこと。
    - type: box
      x: repair_group__色ブツ
      y: trend__浮遊ゴミ_中上塗ブース前_粒子数_小_測定値
      filters:
        - {column: repair_group__色ブツ, in: [修正なし, 色ブツ]}
        - {column: ブース__Line, eq: 1}
      title: "[Line1] 修正なし vs 色ブツ修正 ｜ 浮遊ゴミ 中上塗ブース前 粒子数(小)"
      output: repair_group_色ブツ_浮遊ゴミ_line1.png
    - type: box
      x: repair_group__色ブツ
      y: trend__浮遊ゴミ_中上塗ブース前_粒子数_小_測定値
      filters:
        - {column: repair_group__色ブツ, in: [修正なし, 色ブツ]}
        - {column: ブース__Line, eq: 2}
      title: "[Line2] 修正なし vs 色ブツ修正 ｜ 浮遊ゴミ 中上塗ブース前 粒子数(小)"
      output: repair_group_色ブツ_浮遊ゴミ_line2.png
  custom_chart_max_hue: 8          # hue 水準数の上限（超過分は頻度上位のみ描画し WARN）
  custom_chart_max_points: 20000   # scatter の最大描画点数（超過時は決定的サンプリング）

# ---------------------------------------------------------------------
# 実データ取り込み（docs/real_data_ingest_design.md）。CLI: convert / assemble
# ---------------------------------------------------------------------
real_ingest:
  raw_dir: data/raw
  lake_dir: data/lake                    # 変換済み Parquet レイク
  manifest_path: data/lake/_manifest.json
  panel_path: data/interim/vin_panel.parquet
  kinds: [traceability, trend, defect, repair]   # repair は空でも可

  # "{kind}/{source_key}" -> 別名（レイクのディレクトリ名・列接頭辞に使う）。
  # repair/defect.csv のソース名が defect kind の "defect" と衝突するため解消する（R7）。
  source_aliases:
    repair/defect: 修正

  convert:
    encoding: utf-8-sig
    encoding_fallbacks: ["cp932"]         # ヘッダ読取が UnicodeDecodeError のとき順に試す
    datetime_format: "%Y/%m/%d %H:%M:%S"
    datetime_format_fallbacks: ["%Y/%m/%d %H:%M"]   # 主フォーマットで失敗した値だけ再トライ（秒なしソース対応）
    chunksize: 200000
    downcast_float: true
    keep_float64_suffixes: ["積算値", "総合計"]   # 精度維持する列の末尾トークン
    datetime_column_keywords: ["通過日時", "DATETIME"]
    max_datetime_parse_failure_rate: 0.01        # 超過で WARN

    # kind 単位の上書き（書かれていない kind は従来どおり）。docs/real_data_repair_design.md §2。
    by_kind:
      repair:
        encoding: cp932
        time_column: PB_ON           # date パーティションのアンカー（_resolve_time_column より優先。R3）
        strip_apostrophe: true       # 全 object 列の先頭 "'" を1文字だけ除去（R2）
        na_values: ["00000000 000000"]   # 日時パース前に NA へ置換する番兵
        combine_datetime:            # 日付列＋時刻列 → 新規日時列
          - {name: 修正日時, date_column: 修正日, time_column: 修正時間, format: "%Y/%m/%d %H:%M:%S"}
        datetime_columns:            # datetime_column_keywords で拾えない日時列
          - columns: [WB_ON, WB_OK, PB_ON, PB_OK, AB_ON, EG_OK, AB_OK, FC_OK]
            format: "%Y%m%d %H%M%S"
        pii:
          columns: [修正員]
          mode: hash                 # hash | drop | keep（R6）
          salt: ""                   # 空なら環境変数 DEFECT_ANALYSIS_PII_SALT、それも無ければソルト無し
          suffix: _id                # 修正員 -> 修正員_id

  vin:
    suffix_policy: keep        # keep（既定・別キー） | merge（vin_base で丸める）
    exclude_regex: "(?i)(DUMMY|EMPTY)"

  # 複数行/VIN ソース（上塗/下塗/ホイ黒ロボット。自動判定・宣言不要）の集約。
  # docs/panel_prune_and_multirow_agg_design.md §5（M1〜M6。D5 の統計量全廃を上書き）
  multi_row:
    enabled: true
    # 末尾一致したら「ロボットごとに異なる測定値」とみなし統計量に畳む。
    # 一致しない列は VIN 内一定とみなし代表値 1 列にする（値からは判定しない。M2）
    stat_suffixes: [測定値, 設定値, RT値, 使用量, 充填量, 排出量, サイクルタイム]
    # 2026-08-30 ユーザー判断: min/std/max を外し mean のみ（上塗/下塗/ホイ黒 3 ソース共通）。
    # __min は非稼働ロボットの 0 を拾うだけで工程情報を持たない列が多く、列数を必要以上に
    # 増やさない方針とした（実測で上塗の __min 列12本中8本が定数落ち）。
    numeric_aggs: [mean]                  # stat 列に適用
    datetime_aggs: [min]                  # 日時列。__min は trend アンカーにも使われる（対象外・変更なし）
    exclude_columns: [ロボット]            # 行の識別子。代表値に意味が無く n_rows と情報が重複（M6）
    by_source: {}                         # ソース別上書き（M5）。3 ソースとも mean で揃ったため既定は無し

  defect:                      # 出力は {P}__has のみ（D11）。種類/部位/時刻系のキーは撤廃済み
    size_column: 不良サイズ    # 正規化後の列名（by_size_bin 有効時のみ使う）
    by_size_bin: false         # true で {P}__size_bin__* を生成（既定 off。22 列/ソース増える）
    size_bin_width: 0.1        # ビン幅[mm]（> 0）
    size_bin_min: 0.0          # 下限[mm]。これ未満は "{size_bin_min}未満" ビンへ
    size_bin_max: 2.0          # 上限[mm]。これ以上は "{size_bin_max}以上" ビンへ（外れ値の吸収先）

  # repair（修正実績）ソースの VIN 集約設定。docs/real_data_repair_design.md §2/§3.3。
  repair:
    time_column: 修正日時            # first_ts / last_ts の元（convert の combine_datetime で生成）
    production_time_column: PB_ON
    workload_column: 修正工数
    category_columns:                # 列 -> カウント展開するか
      大分類: true
      中分類: false
      小分類: false
      部品名: false
      修正内容: false
      部位: false
      統合カテゴリ: true             # ★追加: 対比表のグラフ項目（43 列。docs/repair_integrated_category_design.md）
    worker_column: 修正員_id         # pii.suffix 適用後の名前
    max_category_columns: 100        # ★30 -> 100（大分類 29 + 統合カテゴリ 43 = 72 に対する余裕）

    # ★追加: 塗装課内不良対比表による統合カテゴリ付与（4キー厳密一致。IC4）
    category_map:
      enabled: true
      path: config/塗装課内不良対比表_まとめ.csv   # cfg.root 基準の相対パス
      key_columns:                   # 対比表の列 -> repair の列（この順で完全一致。フォールバック無し）
        作業工程: 入力工程
        大分類: 大分類
        中分類: 中分類
        小分類: 小分類
      value_column: グラフ項目
      output_column: 統合カテゴリ
      excluded_values: ["-"]         # 表が「グラフ集計対象外」を明示する値
      labels:                        # 未一致行に必ず入る値（NaN を作らない。IC6）
        out_of_scope_process: 対象外工程   # 入力工程が対比表に無い（塗装課以外の工程）
        unmatched: 未分類                  # 対象工程だが4キーの組合せが表に無い（表の育て漏れ）
        excluded: グラフ対象外             # グラフ項目が "-"
      on_duplicate_key: first        # first（グラフ項目の昇順先頭を採用＋WARN） | error（即停止）

  trend:
    enabled: true
    include_suffixes: ["測定値", "計算値"]   # 末尾トークン一致で採用
    include_columns: []        # 非空ならこの明示リストのみ採用（include_suffixes より優先）
    exclude_columns: []
    mode: window               # window | point
    window_minutes: 11         # 中心窓（±5分）。mode=window のとき有効
    tolerance_minutes: 5       # merge_asof の許容差
    aggs: [mean]
    anchor_map: {}             # トークン -> traceability ソース名（規則で解決できない場合のみ記述）
    fallback_anchor_source: ブース
    on_no_overlap: warn_empty  # warn_empty | skip | error
    min_match_rate: 0.5        # 下回ると WARN

  assemble:
    date_from: null            # "2026-07-24"（null で全期間）
    date_to: null
    require_sources: []        # 0 行なら ValueError にするソース名
    max_columns_per_source: 200   # size_bin と複数行/VIN 集約の両方の列数ガード（§5.3）

    # 低カーディナリティ列の剪定。docs/panel_prune_and_multirow_agg_design.md §4（P1〜P8）
    prune_low_cardinality:
      enabled: true
      drop_all_nan: true          # nunique(dropna=True) == 0
      drop_constant: true         # nunique(dropna=True) == 1（2 値は落とさない）
      protect_columns: [vin, vin_base, vin_pass_no, vin_format, has_repair_record]
      protect_prefixes: [present__, defect_, repair_]
      protect_name_substrings: [フラグ]   # 部分一致。ユーザー指示「フラグとついた列はそのままにする」
      report_filename: panel_pruned_columns.csv

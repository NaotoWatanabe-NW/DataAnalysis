# =====================================================================
# 不良原因追求パイプライン 設定ファイル
#   VIN を主キーに 4 データ（トレーサビリティ/トレンド/不良/修正）を
#   統合・加工する。パス・対象期間・閾値・カテゴリ統合をここで一元管理。
# =====================================================================

project:
  name: defect-cause-analysis
  random_seed: 42

paths:
  raw_dir: data/raw            # 生成された分割 CSV 群
  interim_dir: data/interim    # 収集・統合済みの中間テーブル
  processed_dir: data/processed # 特徴量テーブル（分析用マート）
  reports_dir: reports         # データ辞書・サマリ
  logs_dir: logs

storage:
  # parquet を推奨（設計書 8 章）。pyarrow 未導入環境では自動で csv に
  # フォールバックする（io_utils.resolve_format 参照）。
  format: parquet              # parquet | csv

# ---------------------------------------------------------------------
# 取り込み時の列名正規化（実データの列名 -> パイプライン標準列名）
#   read_csv 直後に rename し、その後で必須列チェックを行う。
#   マップが無い/空なら現行どおり（CSV の列名がそのまま標準列名である前提）。
#   設定例（実データの日本語列名 -> 標準列名）:
#     ingest:
#       column_maps:
#         traceability: {車台番号: vin, 設備ID: equipment_id, 投入時刻: in_ts, 払出時刻: out_ts}
# ---------------------------------------------------------------------
ingest:
  column_maps:
    traceability: {}
    trend: {}
    defect: {}
    repair: {}

# ---------------------------------------------------------------------
# データカタログ（CSVの各列名・型・元ファイル名等を YAML に記録）
# ---------------------------------------------------------------------
catalog:
  input_glob: "data/raw/**/*.csv"   # 走査対象（glob。ディレクトリ/単一ファイルも可）
  output_path: reports/data_catalog.yaml
  datetime_detect_ratio: 0.9        # object列を日時とみなす最小パース成功率

# ---------------------------------------------------------------------
# 合成データ生成（実データが来たら generate 工程を差し替えるだけで良い）
# ---------------------------------------------------------------------
synthesize:
  n_vin: 2000
  months: ["2026-01", "2026-02", "2026-03"]
  plant: P01
  lines: ["L-A", "L-B"]
  operators: ["op_sato", "op_suzuki", "op_takahashi", "op_tanaka", "op_ito", "op_yamada"]
  trend_rel_std: 0.08          # 各測定値の相対ばらつき（平均に対する比）
  driver_gain: 1.2             # VIN 品質潜在変数がドライバ測定値を動かす強さ

  # 設備（工程）定義。工程順にこのリストの順で通過する。
  # trend_means: その設備で測定する数値項目の平均値。
  equipments:
    - id: EQ-01
      name: 圧入
      trend_means: {torque: 45.0, temperature: 25.0, pressure: 80.0, vibration: 1.5}
    - id: EQ-02
      name: 締結
      trend_means: {torque: 60.0, temperature: 26.0, pressure: 20.0, vibration: 1.2}
    - id: EQ-03
      name: 塗布
      trend_means: {torque: 5.0, temperature: 40.0, pressure: 15.0, vibration: 0.8}
    - id: EQ-04
      name: 溶接
      trend_means: {torque: 8.0, temperature: 120.0, pressure: 10.0, vibration: 3.0}
    - id: EQ-05
      name: 検査
      trend_means: {torque: 2.0, temperature: 24.0, pressure: 5.0, vibration: 0.5}

  # 不良の発生機構：どの設備のどの測定値が高いとどの不良を招くか（信号注入）。
  # これにより後段の統計/機械学習で実際に検出可能な因果が生まれる。
  defect_drivers:
    - {equipment_id: EQ-01, measure: pressure,    category: 寸法不良, slope: 1.1, intercept: -2.6, severity_weights: [0.6, 0.3, 0.1]}
    - {equipment_id: EQ-02, measure: torque,      category: 組付不良, slope: 1.3, intercept: -2.7, severity_weights: [0.4, 0.4, 0.2]}
    - {equipment_id: EQ-03, measure: temperature, category: 外観不良, slope: 1.0, intercept: -2.8, severity_weights: [0.7, 0.25, 0.05]}
    - {equipment_id: EQ-04, measure: vibration,   category: 機能不良, slope: 1.5, intercept: -2.9, severity_weights: [0.2, 0.4, 0.4]}
  # 上記ドライバに依らない偶発不良（その他）の基準確率
  random_defect_rate: 0.02
  # 不良ありVINが修正される割合（修正データは 0..1 の基数を保つ）
  repair_rate_given_defect: 0.7

# ---------------------------------------------------------------------
# 特徴量作成・カテゴリ統合
# ---------------------------------------------------------------------
features:
  severe_defect_level: 3          # この severity 以上を重大不良とみなす
  rare_category_threshold: 0.01   # 出現率がこの割合未満のカテゴリを OTHER に集約
  outlier_clip_quantiles: [0.01, 0.99]  # 数値特徴量のクリップ範囲（null で無効）

  # 不良の細分類 -> 大分類 への統合マップ（analysis 用の粒度を粗くする例）
  defect_category_coarse_map:
    寸法不良: 寸法系
    組付不良: 組立系
    外観不良: 外観系
    機能不良: 機能系
    その他: その他

# ---------------------------------------------------------------------
# 分析（EDA / 統計検定 / 機械学習）共通設定
#   目的: 「工程データ(トレンド・通過時間・設備・時間帯)から不良を予測/説明できるか」
#   を検証する。不良/修正の結果由来列はリークとして説明変数から必ず除外する。
# ---------------------------------------------------------------------
analysis:
  targets:
    classification: [has_defect, has_severe_defect]  # 不良有無 / 重大不良有無
    regression: [defect_count]                        # 不良点数

  # 行フィルタ: load_features 読込直後に「リスト順」で AND 適用する（EDA/ML/stats 全系に効く）。
  #   省略 or 空リストなら全件（現行挙動と完全一致）。
  #   1要素 = 「column + 演算子」か「query 単独」。演算子: eq / in / not_in / min / max。
  #   min と max は同一句で併用可（数値レンジ）。EQ-xx__measure のようにハイフンを含む列名は
  #   query の識別子として扱えないため、EQ 列はレンジ/集合系の句（min/max/in）で指定する。
  #   設定例:
  #     filters:
  #       - {column: process_month, in: ["2026-01", "2026-02"]}   # 年月の複数指定
  #       - {column: plant_code,    eq: P01}                       # 存在時のみ有効（無ければ後述ポリシで処理）
  #       - {column: operator,      not_in: [op_ito]}              # 特定作業者を除外
  #       - {column: is_weekend,    eq: 0}                          # 平日のみ（is_weekend は 0/1）
  #       - {column: production_shift, in: ["1直", "2直"]}          # シフト
  #       - {column: lead_time_sec, min: 60, max: 3600}            # 数値レンジ（任意の数値列に対して）
  #       - {query: "ng_rate < 0.5"}                                # 任意式（pandas.DataFrame.query）
  filters: []

  # 存在しない列を指定した句の扱い: warn=その句だけスキップして継続 / error=即エラー
  #   plant_code・line_code のように「実データ次第で無い列」を warn で安全に無視する用途。
  filters_on_missing_column: warn   # warn | error（既定 warn）

  # （任意）設備別ドライバ測定値のハイライト対象。空なら synthesize.defect_drivers を参照し、
  #   それも無ければハイライトなし。図の生成対象は features のトレンド列から動的に導出するので、
  #   この設定が無くても図は出る（ハイライト＝箱ひげ小見出しに信号測定値の印を付けるだけ）。
  eda_driver_highlight: []

  # 説明変数から除外する結果由来列（不良・修正の帰結）。
  #   leakage_prefixes / leakage_regex の規約で拾える列は極力ここに書かない
  #   （新しい結果列が増えても規約側で自動的に拾える状態を保つため）。
  leakage_columns: [first_defect_date, last_defect_date]
  # 結果由来列を接頭辞ファミリで自動除外（手動リスト保守を減らす）。
  #   EQ-xx__*, lead_time_*, wait_*, *_gap_sec, operator, production_*, is_weekend,
  #   process_month, plant_code, line_code, lot_no はいずれの接頭辞にも該当しない。
  leakage_prefixes: [defect, repair, severe, severity, top_defect, max_severity, time_to_repair, has_defect, has_severe, has_repair]
  # 名前が prefix に乗らない結果列（例: first_defect_date / last_defect_date）向けの正規表現（任意）
  leakage_regex: ["_defect_", "defect_date$"]
  # 識別子・生時刻（説明変数にしない）
  id_columns: [vin, lot_no, first_in_ts, last_out_ts]
  cv_folds: 5
  test_size: 0.25
  random_state: 42
  # EDA で層別に使う主な目的変数
  eda_target: has_defect

    "pandas>=3.0.5",
    "polars>=1.43.0",
    "pyarrow>=25.0.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "shap",
    "statsmodels>=0.14.6",
]

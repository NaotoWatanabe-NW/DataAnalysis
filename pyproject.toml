[project]
name = "dataanalysis"
version = "0.1.0"
description = "VINを主キーに設備トレーサビリティ/トレンド/不良/修正を統合し不良原因を追求する分析パイプライン"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "numpy>=2.4,<2.5",
    "pandas>=3.0.5",
    "polars>=1.43.0",
    "pyarrow>=25.0.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "shap",
    "statsmodels>=0.14.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "slow: 実データを使う低速テスト（デフォルトでは除外しない）",
]

# numba は numpy<2.5 を要求するため、numpy を 2.4 系に固定しないと
# 解決器が numba 0.53.1 (Python<3.10 専用) まで後退してビルドに失敗する。
# 併せて numba の下限を制約し、全プラットフォームで 0.53.1 を排除する。
[tool.uv]
constraint-dependencies = ["numba>=0.62"]
